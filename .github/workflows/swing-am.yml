name: Swing AM

on:
  schedule:
    - cron: '5 3 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing
  cancel-in-progress: false

jobs:
  trade-am:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    env:
      TZ: Asia/Kolkata
      TELEGRAM_BOT_TOKEN: ${{ secrets.SWING_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.SWING_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: swing/requirements.txt

      - name: Install dependencies
        run: pip install -r swing/requirements.txt

      - name: Run bot (AM slice, killed ~12:35 IST)
        working-directory: swing
        run: timeout -s TERM 210m python main.py --paper-trade || true

      - name: Save state to repo
        if: always()
        run: |
          git config user.name "bot-actions"
          git config user.email "bot-actions@users.noreply.github.com"
          git add swing/paper_portfolio.json swing/logs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "swing AM state $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
